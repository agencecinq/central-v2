databases:
  - name: cinq-central-db
    region: frankfurt
    plan: basic-256mb
    diskSizeGB: 1
    databaseName: cinq_central
    user: cinq

services:
  - type: web
    name: cinq-central
    runtime: node
    region: frankfurt
    plan: starter
    branch: main
    buildCommand: npm install && rm -rf src/generated/prisma && npx prisma generate && npx prisma db push && npm run build && cp -r .next/static .next/standalone/.next/static && cp -r public .next/standalone/public
    startCommand: PORT=$PORT node .next/standalone/server.js
    healthCheckPath: /login
    disk:
      name: cinq-central-uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cinq-central-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      # Racine où sont stockés les uploads (ressources projet, etc.).
      # Le disque persistant est monté sur /var/data — on y crée un sous-dossier
      # uploads/ pour ne pas mélanger avec d'autres usages futurs.
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: QONTO_LOGIN
        sync: false
      - key: QONTO_SECRET_KEY
        sync: false
      - key: AUTH_TRUST_HOST
        value: "true"
      # ─── Auto-Resolve (côté CinqCentral) ─────────────────────────
      # URL du worker — récupérée depuis le service Render correspondant.
      - key: AUTORESOLVE_WORKER_URL
        fromService:
          name: cinq-auto-resolve-worker
          type: web
          property: host
      # Secrets partagés worker ↔ CinqCentral. À remplir dans le dashboard
      # (mêmes valeurs des deux côtés).
      - key: AUTORESOLVE_WEBHOOK_SECRET
        sync: false
      - key: AUTORESOLVE_INTERNAL_TOKEN
        sync: false

  - type: web
    name: cinq-auto-resolve-worker
    runtime: docker
    region: frankfurt
    plan: starter
    branch: main
    rootDir: worker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: LOG_LEVEL
        value: info
      # ─── Redis (BullMQ) ────────────────────────────────────────
      - key: REDIS_URL
        fromService:
          name: cinq-auto-resolve-redis
          type: keyvalue
          property: connectionString
      # ─── Auth partagée avec CinqCentral ────────────────────────
      - key: CINQCENTRAL_BASE_URL
        sync: false  # ex: https://cinq-central.onrender.com
      - key: AUTORESOLVE_WEBHOOK_SECRET
        sync: false  # même valeur que côté cinq-central
      - key: AUTORESOLVE_INTERNAL_TOKEN
        sync: false  # idem
      # ─── Anthropic ─────────────────────────────────────────────
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_CLASSIFIER_MODEL
        value: claude-haiku-4-5-20251001
      - key: AGENT_MODEL
        value: claude-sonnet-4-6
      - key: AGENT_TIMEOUT_MS
        value: "900000"
      - key: AGENT_MAX_TURNS
        value: "40"
      # ─── GitHub ────────────────────────────────────────────────
      - key: GITHUB_PAT
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      # ─── Slack ─────────────────────────────────────────────────
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_INTERNAL_CHANNEL_ID
        sync: false
      # ─── Workdir & cache ───────────────────────────────────────
      - key: WORK_DIR
        value: /tmp/auto-resolve
      - key: STACK_CACHE_DAYS
        value: "7"
      # ─── Mode dry-run ──────────────────────────────────────────
      # Phase 4: agent tourne mais pas de push GitHub. Passer à false en Phase 5.
      - key: DRY_RUN
        value: "true"
      - key: MONTHLY_BUDGET_USD
        value: "200"

  - type: keyvalue
    name: cinq-auto-resolve-redis
    region: frankfurt
    plan: starter
    ipAllowList: []  # accessible uniquement depuis le réseau privé Render
